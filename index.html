class DCLogic{constructor(){this.props={theme:'emerald'};}setState(o){Object.assign(this.state,o);window.__render();}}

/* IMSRA 3D gem engine: software-rendered facet mesh on a 2D canvas */
const GEM_SHAPES = {
  round:   { name: 'Round',    len: 1.00, outline: (t) => [Math.sin(t), Math.cos(t)] },
  oval:    { name: 'Oval',     len: 1.22, outline: (t) => [0.74 * Math.sin(t), Math.cos(t)] },
  pear:    { name: 'Pear',     len: 1.32, outline: (t) => { const z = Math.cos(t), w = Math.pow((1 + z) / 2, 0.75); return [0.8 * Math.sin(t) * (0.12 + 0.88 * w), 1.1 * z]; } },
  emerald: { name: 'Emerald',  len: 1.28, outline: (t) => { const s = Math.sin(t), c = Math.cos(t), p = 6; const k = Math.pow(Math.pow(Math.abs(s) / 0.74, p) + Math.pow(Math.abs(c), p), 1 / p); return [s / k, c / k]; } },
  cushion: { name: 'Cushion',  len: 0.98, outline: (t) => { const s = Math.sin(t), c = Math.cos(t), p = 2.7; const k = Math.pow(Math.pow(Math.abs(s), p) + Math.pow(Math.abs(c), p), 1 / p); return [0.97 * s / k, 0.97 * c / k]; } },
  marquise:{ name: 'Marquise', len: 1.55, outline: (t) => { const s = Math.sin(t); return [0.56 * Math.sign(s) * Math.pow(Math.abs(s), 1.3), 1.18 * Math.cos(t)]; } }
};
const gemCache = {};
function gemMesh(key) {
  if (gemCache[key]) return gemCache[key];
  const N = 16, sh = GEM_SHAPES[key];
  const ring = (scale, y, off) => {
    const a = [];
    for (let i = 0; i < N; i++) { const t = ((i + off) / N) * Math.PI * 2; const p = sh.outline(t); a.push([p[0] * scale, y, p[1] * scale]); }
    return a;
  };
  const HC = 0.34, HP = 0.82;
  const G = ring(1, 0, 0), T = ring(0.58, HC, 0), K = ring(0.8, HC * 0.58, 0.5), P = ring(0.5, -HP * 0.46, 0.5);
  const C = [0, -HP, 0];
  const faces = [];
  const add = (pts, kind, seed) => faces.push({ pts, kind, seed });
  add(T.slice(), 'table', 0);
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N, h = (i + N - 1) % N;
    add([T[i], T[j], K[i]], 'star', i);
    add([T[i], K[h], G[i], K[i]], 'bezel', i);
    add([K[i], G[i], G[j]], 'upper', i);
    add([G[j], G[i], P[i]], 'lower', i);

(function(){

function expandFor(t,vals){return t.replace(/<sc-for list="\{\{(\w+)\}\}" as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g,function(_,l,v,inner){
 return (vals[l]||[]).map(function(it){return inner.replace(/\{\{(\w+)\.(\w+)\}\}/g,function(m,a,b){if(a!==v)return m;var x=it[b];if(typeof x==='function'){H.push(x);return 'h'+(H.length-1);}return String(x);});}).join('');});}
function render(){H=[];var vals=comp.renderVals();var t=expandFor(TPL,vals);
 t=t.replace(/onClick="\{\{(\w+)\}\}"/g,function(m,k){H.push(vals[k]);return 'data-h="'+(H.length-1)+'"';});
 t=t.replace(/onClick="h(\d+)"/g,'data-h="$1"');
 t=t.replace(/\{\{(\w+)\}\}/g,function(m,k){var x=vals[k];return x==null?'':String(x);});
 var y=window.scrollY;document.getElementById('app').innerHTML=t;window.scrollTo(0,y);}

})();
